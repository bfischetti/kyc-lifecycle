services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KYC_OWNER_PASSWORD: ${KYC_OWNER_PASSWORD:?set in .env}
      KYC_APP_PASSWORD: ${KYC_APP_PASSWORD:?set in .env}
      KYC_DB_NAME: kyc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kyc"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Evidence Vault: S3-compatible object storage (ADR-0001, ADR-0002).
  # Keep the image in sync with internal/testenv/vault.go.
  vault:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${VAULT_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${VAULT_SECRET_KEY:?set in .env}
    ports:
      - "${VAULT_PORT:-9000}:9000"
    volumes:
      - vaultdata:/data

  # One-shot: creates the private bucket if it does not exist yet.
  vault-init:
    image: amazon/aws-cli:latest
    depends_on:
      - vault
    environment:
      AWS_ACCESS_KEY_ID: ${VAULT_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${VAULT_SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${VAULT_BUCKET:-evidence}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://vault:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null && echo "bucket $$BUCKET exists" && exit 0
          aws --endpoint-url http://vault:9000 s3api create-bucket --bucket "$$BUCKET" && echo "bucket $$BUCKET created" && exit 0
          sleep 1
        done
        echo "vault not reachable" >&2; exit 1

  # Stand-in Downstream Consumer: verifies and logs the signed Status Change
  # Notifications the app sends to WEBHOOK_URL. Watch it with
  # `docker compose logs -f webhook-sink`.
  webhook-sink:
    build:
      context: .
      dockerfile: deploy/webhook-sink/Dockerfile
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set in .env}
    ports:
      - "${WEBHOOK_SINK_PORT:-8090}:8090"

volumes:
  pgdata:
  vaultdata:
